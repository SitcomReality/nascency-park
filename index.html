<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nascency Park</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "nipplejs": "https://esm.sh/nipplejs"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- The Living Canvas -->
        <canvas id="world"></canvas>

        <!-- Top Info Bar (Minimal) -->
        <div id="top-bar">
            <div id="tick-counter">Tick: 0</div>
            <div id="population">Alive: 0</div>
        </div>

        <!-- Main Overlay for Interactions -->
        <div id="ui-layer">
            
            <!-- Active Tool Display -->
            <div id="active-tool-indicator">
                <span id="tool-name">Brush: Photon</span>
            </div>

            <!-- Bottom Control Deck -->
            <div class="control-deck glass-panel">
                
                <!-- Transport Controls -->
                <div class="transport-controls">
                    <button id="btn-reset" class="icon-btn" aria-label="Reset"></button>
                    <button id="btn-play-pause" class="icon-btn" aria-label="Play/Pause"></button>
                    <button id="btn-step" class="icon-btn" aria-label="Step Forward">></button>
                </div>

                <!-- Primary Actions -->
                <div class="action-controls">
                    <button id="btn-tools" class="text-btn active">Tools</button>
                    <button id="btn-rules" class="text-btn">Rules</button>
                </div>
            </div>

            <!-- Tool Picker (Slide-up Panel) -->
            <div id="panel-tools" class="slide-panel glass-panel">
                <h3>Seeds</h3>
                <div class="seed-grid" id="seed-palette">
                    <!-- Generated by JS -->
                </div>
                <h3>Brush Size</h3>
                <input type="range" id="brush-size" min="1" max="5" value="1">
            </div>

            <!-- Rule Editor (Slide-up Panel) -->
            <div id="panel-rules" class="slide-panel glass-panel hidden">
                <h3>Ecosystem Rules</h3>
                <div class="rule-presets">
                    <button class="preset-btn active" data-preset="classic">Life</button>
                    <button class="preset-btn" data-preset="bloom">Spiral Bloom</button>
                    <button class="preset-btn" data-preset="forest">Fractal Forest</button>
                    <button class="preset-btn" data-preset="predator">Predator/Prey</button>
                </div>
                <div class="rule-tweak">
                    <label>Simulation Speed</label>
                    <input type="range" id="sim-speed" min="1" max="60" value="10">
                </div>
                <div class="rule-desc" id="current-rule-desc">
                    Standard cellular automata.
                </div>
            </div>

    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
